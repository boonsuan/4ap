name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Lean and Python checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      - name: Build and lint Lean
        uses: leanprover/lean-action@50fcf42d2e460296f1a34b402e990d1b24f8b596 # v1
        with:
          auto-config: false
          build: true
          build-args: '--wfail'
          lint: true
          use-mathlib-cache: true

      - name: Check theorem statement and axioms
        run: lake env lean FourAP/Audit.lean

      - name: Check Python documentation examples
        run: python3 -m doctest four_ap.py

      - name: Test Python and its agreement with Lean
        run: |
          command -v lake
          python3 -m unittest discover -s tests -v
