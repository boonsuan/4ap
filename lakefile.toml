name = "four-ap"
version = "0.1.0"
defaultTargets = ["FourAP"]
lintDriver = "batteries/runLinter"
lintDriverArgs = ["FourAP"]

[leanOptions]
autoImplicit = false
weak.linter.mathlibStandardSet = true
weak.linter.style.header.license = "Released under MIT license as described in the file LICENSE."

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.33.1"

[[lean_lib]]
name = "FourAP"
